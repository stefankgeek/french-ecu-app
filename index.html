<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover : utilise tout l'écran, les zones sûres (encoche) sont gérées en CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="French ECU : simulateurs de préparation moteur (injecteurs, turbo, E85, NOS, bielle…) et aide-mémoire technique, hors connexion." />

  <!-- iOS : appli plein écran depuis l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="French ECU" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

  <title>French ECU</title>

  <!-- Styles critiques de l'écran de démarrage : affichés avant tout JavaScript -->
  <style>
    html, body { margin: 0; background: #05070b; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 42%, #123a5c 0%, #0b1220 45%, #05070b 100%);
      transition: opacity .45s ease, visibility .45s ease;
    }
    #splash.is-hidden { opacity: 0; visibility: hidden; }
    #splash img { width: min(42vw, 190px); height: auto; animation: fe-pop 1.1s cubic-bezier(.2,.8,.2,1) both, fe-glow 2s ease-in-out .9s infinite alternate; }
    #splash .fe-name {
      font: 700 clamp(22px, 6vw, 34px)/1 'Orbitron', system-ui, sans-serif; letter-spacing: .18em;
      color: #fff; background: linear-gradient(90deg, #4a90e2, #00d4ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: fe-up .9s .35s ease both;
    }
    #splash .fe-bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; animation: fe-up .9s .5s ease both; }
    #splash .fe-bar::after { content: ''; display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #4a90e2, #00d4ff); transform-origin: left; animation: fe-load 1.8s .2s ease-out both; }
    @keyframes fe-pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
    @keyframes fe-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes fe-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fe-glow { from { filter: drop-shadow(0 0 0 rgba(0,212,255,0)); } to { filter: drop-shadow(0 0 22px rgba(0,212,255,.45)); } }
    /* Accessibilité : animations réduites si l'utilisateur l'a demandé dans son téléphone */
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
  </style>
</head>
<body>
  <!-- Écran de démarrage (2 secondes) -->
  <div id="splash" role="img" aria-label="French ECU">
    <img src="/icons/logo-mark.svg" alt="" width="190" height="190" />
    <div class="fe-name">FRENCH&nbsp;ECU</div>
    <div class="fe-bar"></div>
  </div>

  <!-- Application -->
  <div id="app" aria-live="polite"></div>

  <noscript>French ECU nécessite JavaScript. / French ECU requires JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
